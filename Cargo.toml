[workspace]
members = [
  "crates/companion",
  "crates/companion-pdf",
  "crates/companion-agent-host",
  "crates/companion-store",
  "crates/companion-env",
  "crates/pdf-view",
]
resolver = "2"

# GPUI, hayro and Wasmtime are too slow unoptimised for an interactive GUI.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"
publish = false

[workspace.dependencies]
gpui = { package = "gpui-pre", version = "=0.3.2" }  # gpui-pdf 0.6.1 uses the pre-0.3.10 Modifiers::secondary() API
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.2", features = ["font-kit", "wayland", "x11", "runtime_shaders"] }
gpui-pdf = { path = "crates/pdf-view", features = ["search"] }
# Keep all component crates exact: newer 0.6.x releases drift beyond the
# gpui-pre 0.3.2 snapshot required by gpui-pdf 0.6.1.
gpui-component = "=0.6.0"
gpui-base = "=0.6.0"
gpui-component-macros = "=0.6.0"
gpui-kit-assets = "=0.6.0"
hayro = "0.7"
image = "0.25"
rfd = "0.15"
rusqlite = { version = "0.40", features = ["bundled", "blob"] }  # zorite uses 0.40; 0.41.0 exists (2026-10-24)
parking_lot = "0.12"
uuid = { version = "1", features = ["v4", "v7", "serde"] }
sha2 = "0.10"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
crossbeam-channel = "0.5"
wasmtime = { version = "=36.0.19", features = ["component-model"] }
wasmtime-wasi = "=36.0.19"
wasmtime-wasi-http = "=36.0.19"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "blocking"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
directories = "6"
