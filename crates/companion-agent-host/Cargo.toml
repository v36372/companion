[package]
name = "companion-agent-host"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
agent = ["dep:wasmtime", "dep:wasmtime-wasi", "dep:wasmtime-wasi-http", "dep:bytes", "dep:http-body", "dep:http-body-util", "dep:hyper", "dep:tokio", "dep:hyper-util", "dep:tokio-rustls", "dep:webpki-roots"]

[dependencies]
anyhow.workspace = true
companion-store = { path = "../companion-store" }
companion-env = { path = "../companion-env" }
rusqlite.workspace = true
crossbeam-channel.workspace = true
serde_json.workspace = true
tracing.workspace = true
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
wasmtime = { workspace = true, optional = true }
wasmtime-wasi = { workspace = true, optional = true }
wasmtime-wasi-http = { workspace = true, optional = true }
bytes = { version = "1", optional = true }
http-body = { version = "1", optional = true }
http-body-util = { version = "0.1", optional = true }
hyper = { version = "1", features = ["client", "http1"], optional = true }
hyper-util = { version = "0.1", features = ["tokio"], optional = true }
tokio-rustls = { version = "0.25", optional = true }
webpki-roots = { version = "0.26", optional = true }
# Use wasmtime-wasi's internal runtime (including keychain blocking work); never construct one here.
tokio = { version = "1", features = ["time", "sync", "macros", "net"], optional = true }

[dev-dependencies]
companion-pdf = { path = "../companion-pdf" }
tempfile = "3"
