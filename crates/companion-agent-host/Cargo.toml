[package]
name = "companion-agent-host"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
agent = ["dep:wasmtime", "dep:wasmtime-wasi", "dep:wasmtime-wasi-http", "dep:bytes", "dep:http-body", "dep:http-body-util", "dep:hyper", "dep:tokio"]

[dependencies]
anyhow.workspace = true
crossbeam-channel.workspace = true
serde_json.workspace = true
wasmtime = { workspace = true, optional = true }
wasmtime-wasi = { workspace = true, optional = true }
wasmtime-wasi-http = { workspace = true, optional = true }
bytes = { version = "1", optional = true }
http-body = { version = "1", optional = true }
http-body-util = { version = "0.1", optional = true }
hyper = { version = "1", optional = true }
# Only futures/timers on wasmtime-wasi's internal runtime; NEVER construct a runtime here.
tokio = { version = "1", features = ["time", "sync", "macros"], optional = true }
