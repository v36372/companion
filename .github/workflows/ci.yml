name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token; no job needs secrets or write access.
permissions:
  contents: read

# A new push to the same PR or branch cancels the older run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_BUILD_JOBS: 4
  # Match spike-sse.sh; avoid debug-info overhead and extra profile variants.
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

# Every job runs on Justin's self-hosted exe.dev runner (v36372-gh-runner), never on
# GitHub-hosted runners. Self-hosted jobs run only for pushes to main and for PRs from
# branches in this repository: fork PRs get no job, so fork code never reaches the VM.
# Build dependencies and the Rust toolchain are preinstalled on the runner.

jobs:
  rust:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, exe-gh-runner]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Persistent target dir outside the checkout, so builds stay incremental
      # across runs. The runner's daily cleanup prunes it.
      - name: Use persistent target dir
        run: echo "CARGO_TARGET_DIR=$HOME/ci-target/rust" >> "$GITHUB_ENV"
      - name: Check preinstalled Linux GPUI build dependencies
        run: scripts/ci-check-runner-deps.sh
      - name: Install pinned Rust toolchain
        run: rustup show
      # CI checks correctness, not GUI responsiveness; avoid optimising all deps.
      - name: Use unoptimised CI dev profile
        run: |
          cargo_home="${CARGO_HOME:-$HOME/.cargo}"
          mkdir -p "$cargo_home"
          printf '%s\n' '[profile.dev]' 'opt-level = 0' \
            '[profile.dev.package."*"]' 'opt-level = 0' > "$cargo_home/config.toml"
      - name: Check formatting
        if: hashFiles('Cargo.toml') != ''
        run: cargo fmt --all -- --check
      - name: Test release smoke harness (mock platform, no display)
        run: scripts/test-smoke-macos.sh
      - name: Build workspace
        if: hashFiles('Cargo.toml') != ''
        run: |
          if [ -f Cargo.lock ]; then
            cargo build --workspace --locked
          else
            cargo build --workspace
          fi
      - name: Lint workspace
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test workspace
        if: hashFiles('Cargo.toml') != ''
        run: cargo test --workspace
      - name: Check GPUI snapshot is unambiguous
        if: hashFiles('Cargo.toml') != ''
        run: |
          dependencies="$(cargo tree --workspace --prefix none --format '{p}')"
          if grep -q '^gpui-pre v' <<< "$dependencies"; then
            # An unqualified package name fails when multiple versions are present.
            cargo tree -i gpui-pre --depth 0
          else
            echo "gpui-pre is not in the workspace dependency graph; skipping."
          fi

  # Independent of rust/PDF: never add this job to rust.needs.
  agent:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, exe-gh-runner]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Use persistent target dir
        run: echo "CARGO_TARGET_DIR=$HOME/ci-target/agent" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: agent/package-lock.json
      # Exact matches only: changing any guest/build/WIT input must componentize.
      - name: Restore generated agent component
        id: component
        uses: actions/cache@v4
        with:
          path: |
            crates/companion-agent-host/src/agent-core.wasm
            agent/dist/agent-core.wit
          key: agent-component-v1-${{ runner.os }}-${{ runner.arch }}-node22-${{ hashFiles('agent/src/**', 'agent/*.mjs', 'agent/package*.json', 'agent/tsconfig*.json', 'wit/**') }}
      - run: npm ci
        working-directory: agent
      - name: Check preinstalled keychain and document snapshot build dependencies
        run: scripts/ci-check-runner-deps.sh
      - run: npm test && npm run typecheck
        working-directory: agent
      - name: Bundle agent
        if: steps.component.outputs.cache-hit != 'true'
        run: npm run build
        working-directory: agent
      - run: npm run componentize
        if: steps.component.outputs.cache-hit != 'true'
        working-directory: agent
      - name: Record WASI imports
        if: steps.component.outputs.cache-hit != 'true'
        run: npx jco wit ../crates/companion-agent-host/src/agent-core.wasm > dist/agent-core.wit
        working-directory: agent
      - name: Check pi-ai against local OpenAI-compatible mock (no credentials)
        run: npm run test:mock
        working-directory: agent
      - name: Install pinned Rust toolchain
        run: rustup show
      # Match rust's CI-only profile and keep local GUI development optimised.
      - name: Use unoptimised CI dev profile
        run: |
          cargo_home="${CARGO_HOME:-$HOME/.cargo}"
          mkdir -p "$cargo_home"
          printf '%s\n' '[profile.dev]' 'opt-level = 0' \
            '[profile.dev.package."*"]' 'opt-level = 0' > "$cargo_home/config.toml"
      - name: Lint workspace with agent and mock-provider features
        run: cargo clippy --workspace --all-targets --locked --features companion/test-mock-provider -- -D warnings
      - name: Run component harness, PDF tools, host-auth, streaming and abort tests
        run: scripts/spike-sse.sh --built
      - name: Run window-independent chat bridge against local SSE
        run: cargo test -p companion --features test-mock-provider -- --test-threads=1
