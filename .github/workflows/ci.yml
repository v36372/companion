name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_BUILD_JOBS: 1
  # Match spike-sse.sh; avoid debug-info overhead and extra profile variants.
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux GPUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libx11-xcb-dev libxcb1-dev libfontconfig-dev libfreetype-dev \
            libvulkan-dev libasound2-dev libssl-dev libzstd-dev libsqlite3-dev libdbus-1-dev
      - name: Install pinned Rust toolchain
        run: rustup show
      # CI checks correctness, not GUI responsiveness; avoid optimising all deps.
      - name: Use unoptimised CI dev profile
        run: |
          cargo_home="${CARGO_HOME:-$HOME/.cargo}"
          mkdir -p "$cargo_home"
          printf '%s\n' '[profile.dev]' 'opt-level = 0' \
            '[profile.dev.package."*"]' 'opt-level = 0' > "$cargo_home/config.toml"
      - uses: Swatinem/rust-cache@v2
        with:
          # rust-cache does not include workspace profile settings in its key.
          shared-key: ci-dev-unoptimised-v1
          cache-on-failure: true
      - name: Check formatting
        if: hashFiles('Cargo.toml') != ''
        run: cargo fmt --all -- --check
      - name: Test release smoke harness (mock platform, no display)
        run: scripts/test-smoke-macos.sh
      - name: Build workspace
        if: hashFiles('Cargo.toml') != ''
        run: |
          if [ -f Cargo.lock ]; then
            cargo build --workspace --locked
          else
            cargo build --workspace
          fi
      - name: Lint workspace
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test workspace
        if: hashFiles('Cargo.toml') != ''
        run: cargo test --workspace
      - name: Check GPUI snapshot is unambiguous
        if: hashFiles('Cargo.toml') != ''
        run: |
          dependencies="$(cargo tree --workspace --prefix none --format '{p}')"
          if grep -q '^gpui-pre v' <<< "$dependencies"; then
            # An unqualified package name fails when multiple versions are present.
            cargo tree -i gpui-pre --depth 0
          else
            echo "gpui-pre is not in the workspace dependency graph; skipping."
          fi

  macos:
    runs-on: macos-15
    needs: agent
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Verify Apple Silicon runner
        run: test "$(uname -m)" = arm64
      # agent-core contains paths rooted at the repo (WASM + agent/dist WIT).
      # Reuse the Linux-generated portable component; never componentize on macOS.
      - uses: actions/download-artifact@v4
        with:
          name: agent-core
          path: .
      - name: Verify agent component artifact
        run: test -s crates/companion-agent-host/src/agent-core.wasm
      - name: Install pinned Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-release-agent
          cache-on-failure: true
      - name: Build release app with agent
        run: cargo build --release -p companion --bin learning-companion --features agent --locked
      - name: Lint macOS app with agent
        run: cargo clippy -p companion --all-targets --features agent --locked -- -D warnings
      - name: Smoke release app (no credentials or network)
        run: scripts/smoke-macos.sh target/release/learning-companion "$RUNNER_TEMP/macos-smoke"
      - name: Upload release smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-release-smoke
          path: ${{ runner.temp }}/macos-smoke/
          if-no-files-found: warn

  # Independent of rust/PDF: never add this job to rust.needs.
  agent:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: agent/package-lock.json
      # Exact matches only: changing any guest/build/WIT input must componentize.
      - name: Restore generated agent component
        id: component
        uses: actions/cache@v4
        with:
          path: |
            crates/companion-agent-host/src/agent-core.wasm
            agent/dist/agent-core.wit
          key: agent-component-v1-${{ runner.os }}-${{ runner.arch }}-node22-${{ hashFiles('agent/src/**', 'agent/*.mjs', 'agent/package*.json', 'agent/tsconfig*.json', 'wit/**') }}
      - run: npm ci
        working-directory: agent
      - name: Install keychain and document snapshot build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config libdbus-1-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libx11-xcb-dev libxcb1-dev libfontconfig-dev libfreetype-dev \
            libvulkan-dev libasound2-dev libssl-dev libzstd-dev libsqlite3-dev
      - run: npm test && npm run typecheck
        working-directory: agent
      - name: Bundle agent
        if: steps.component.outputs.cache-hit != 'true'
        run: npm run build
        working-directory: agent
      - run: npm run componentize
        if: steps.component.outputs.cache-hit != 'true'
        working-directory: agent
      - name: Record WASI imports
        if: steps.component.outputs.cache-hit != 'true'
        run: npx jco wit ../crates/companion-agent-host/src/agent-core.wasm > dist/agent-core.wit
        working-directory: agent
      - uses: actions/upload-artifact@v4
        with:
          name: agent-core
          path: |
            crates/companion-agent-host/src/agent-core.wasm
            agent/dist/agent-core.wit
      - name: Check pi-ai against local OpenAI-compatible mock (no credentials)
        run: npm run test:mock
        working-directory: agent
      - name: Install pinned Rust toolchain
        run: rustup show
      # Match rust's CI-only profile and keep local GUI development optimised.
      - name: Use unoptimised CI dev profile
        run: |
          cargo_home="${CARGO_HOME:-$HOME/.cargo}"
          mkdir -p "$cargo_home"
          printf '%s\n' '[profile.dev]' 'opt-level = 0' \
            '[profile.dev.package."*"]' 'opt-level = 0' > "$cargo_home/config.toml"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-dev-unoptimised-v1
          key: agent
          cache-on-failure: true
      - name: Lint workspace with agent and mock-provider features
        run: cargo clippy --workspace --all-targets --locked --features companion/test-mock-provider -- -D warnings
      - name: Run component harness, PDF tools, host-auth, streaming and abort tests
        run: scripts/spike-sse.sh --built
      - name: Run window-independent chat bridge against local SSE
        run: cargo test -p companion --features test-mock-provider -- --test-threads=1
