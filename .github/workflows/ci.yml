name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_BUILD_JOBS: 1

jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux GPUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libx11-xcb-dev libxcb1-dev libfontconfig-dev libfreetype-dev \
            libvulkan-dev libasound2-dev libssl-dev libzstd-dev libsqlite3-dev libdbus-1-dev
      - name: Install pinned Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        if: hashFiles('Cargo.toml') != ''
        run: cargo fmt --all -- --check
      - name: Build workspace
        if: hashFiles('Cargo.toml') != ''
        run: |
          if [ -f Cargo.lock ]; then
            cargo build --workspace --locked
          else
            cargo build --workspace
          fi
      - name: Test workspace
        if: hashFiles('Cargo.toml') != ''
        run: cargo test --workspace
      - name: Check GPUI snapshot is unambiguous
        if: hashFiles('Cargo.toml') != ''
        run: |
          dependencies="$(cargo tree --workspace --prefix none --format '{p}')"
          if grep -q '^gpui-pre v' <<< "$dependencies"; then
            # An unqualified package name fails when multiple versions are present.
            cargo tree -i gpui-pre --depth 0
          else
            echo "gpui-pre is not in the workspace dependency graph; skipping."
          fi

  # Independent of rust/PDF: never add this job to rust.needs.
  agent:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: agent/package-lock.json
      - run: npm ci
        working-directory: agent
      - name: Install native keychain build dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libdbus-1-dev
      - run: npm test && npm run typecheck && npm run build
        working-directory: agent
      - run: npm run componentize
        working-directory: agent
      - name: Record WASI imports
        run: npx jco wit ../crates/companion-agent-host/src/agent-core.wasm > dist/agent-core.wit
        working-directory: agent
      - uses: actions/upload-artifact@v4
        with:
          name: agent-core
          path: |
            crates/companion-agent-host/src/agent-core.wasm
            agent/dist/agent-core.wit
      - name: Check pi-ai against local OpenAI-compatible mock (no credentials)
        run: npm run test:mock
        working-directory: agent
      - name: Install pinned Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          key: agent
      - name: Run MemoryStorage harness, host-auth, streaming and abort tests
        run: scripts/spike-sse.sh --built
